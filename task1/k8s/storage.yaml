apiVersion: v1
kind: PersistentVolume
metadata:
  name: log-archive-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /data/log-archives
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: log-archive-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi 