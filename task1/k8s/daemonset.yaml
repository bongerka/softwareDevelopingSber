apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-agent
  labels:
    app: log-agent
spec:
  selector:
    matchLabels:
      app: log-agent
  template:
    metadata:
      labels:
        app: log-agent
    spec:
      containers:
      - name: log-agent
        image: busybox:1.36
        command: ["/bin/sh"]
        args: ["-c", "while true; do if [ -f /app/logs/app.log ]; then cat /app/logs/app.log; fi; sleep 5; done"]
        volumeMounts:
        - name: logs-volume
          mountPath: /app/logs
      volumes:
      - name: logs-volume
        hostPath:
          path: /app/logs
          type: DirectoryOrCreate 